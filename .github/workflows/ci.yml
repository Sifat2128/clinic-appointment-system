name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Build, Test & E2E Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Backend Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests (TDD & Coverage)
        run: |
          pytest --cov=backend.app --cov-report=term-missing --cov-report=xml backend/tests -v

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run End-to-End Selenium Tests (Headless Chrome)
        run: |
          python e2e/runner.py
